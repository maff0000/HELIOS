# Chain package: a GOLD CONTEXT_TRIGGER composition, for continuous evaluation.
#
# Directional context on H4 must already be established, and still valid, when
# the M5 trigger fires. As with the sequence beside it, each component is
# satisfied by MATCHED or ACTIVE because HELIOS re-evaluates far more often than
# a component's own bar changes.
#
# The expiry is deliberately FRAMES rather than DURATION. For a chain, HELIOS
# counts frames of the FINEST timeframe the package binds - here M5 - because
# that is the resolution at which the chain concludes: a CONTEXT_TRIGGER chain's
# trigger is by definition on its finest timeframe, so twelve frames means
# twelve trigger frames, one hour.
schema_version: helios.strategy_package/1.0.0
kind: CHAIN
identity:
  strategy_id: gold_continuous_context_trigger
  strategy_version: 1.0.0
metadata:
  title: GOLD continuous context/trigger chain
  description: >-
    Directional context on H4, established first and still valid, framing a
    breakout trigger on M5 in the same direction.
  authored_by: HSA
  authored_at_utc: 2026-02-27T09:05:00Z
inputs:
  - role: CONTEXT
    timeframe: H4
    lookback: 2
    required_fields: [close, ema_50, ema_200]
  - role: TRIGGER
    timeframe: M5
    lookback: 20
    required_fields: [high, low, close, atr_14]
parameters: {}
direction:
  mode: DIRECTIONAL
  resolution: FROM_COMPONENTS
  component_relationship: SAME
timing:
  evaluate_on: CLOSED_FRAME
persistence:
  min_matched_frames: 1
  weakening_enabled: true
expiry:
  mode: FRAMES
  frames: 12
chain:
  primitive: CONTEXT_TRIGGER
  explanation_required: true
  components:
    - strategy_id: golden_cross
      strategy_version: 1.0.0
      role: CONTEXT
      direction_relationship: SAME
      required_states: [MATCHED, ACTIVE, WEAKENING]
    - strategy_id: range_breakout
      strategy_version: 1.0.0
      role: TRIGGER
      direction_relationship: SAME
      required_states: [MATCHED, ACTIVE]
