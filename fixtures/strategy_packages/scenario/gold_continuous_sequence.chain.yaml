# Chain package: the GOLD staged sequence, written for CONTINUOUS evaluation.
#
# The PID's template is CONTEXT->4H, LOCATION->1H, CONFIRMATION->15M,
# TRIGGER->5M. That template is expressed HERE, in one package, exactly as the
# PID intends - as per-strategy configuration rather than a global rule.
#
# What distinguishes this definition from gold_staged_sequence@1.0.0 is one
# deliberate specification choice: every component is satisfied by MATCHED *or*
# ACTIVE, not by MATCHED alone. That matters because HELIOS evaluates
# continuously rather than once per bar of the component's own timeframe. A
# 15-minute confirmation that matched at 13:46 is re-evaluated every five
# minutes against the same still-current bar, and publishes ACTIVE from 13:51
# onward - the match is no less true, it is simply no longer new. A chain
# accepting only MATCHED could therefore hold for exactly one evaluation, which
# describes a chain nobody could act on.
#
# This is a different definition and therefore a different strategy_id, never
# an edit to a promoted one.
schema_version: helios.strategy_package/1.0.0
kind: CHAIN
identity:
  strategy_id: gold_continuous_sequence
  strategy_version: 1.0.0
metadata:
  title: GOLD continuous staged sequence
  description: >-
    Context, then location, then confirmation, then trigger - each established
    in the declared order and all within one ordering window, and each still
    holding at the evaluation that composes them.
  authored_by: HSA
  authored_at_utc: 2026-02-27T09:00:00Z
inputs:
  - role: CONTEXT
    timeframe: H4
    lookback: 2
    required_fields: [close, ema_50, ema_200]
  - role: LOCATION
    timeframe: H1
    lookback: 24
    required_fields: [high, low, close]
  - role: CONFIRMATION
    timeframe: M15
    lookback: 1
    required_fields: [open, high, low, close]
  - role: TRIGGER
    timeframe: M5
    lookback: 20
    required_fields: [high, low, close, atr_14]
parameters: {}
direction:
  mode: DIRECTIONAL
  resolution: FROM_COMPONENTS
  component_relationship: SAME
timing:
  evaluate_on: CLOSED_FRAME
persistence:
  min_matched_frames: 1
  weakening_enabled: true
expiry:
  mode: DURATION
  duration_seconds: 7200
chain:
  primitive: SEQUENCE
  ordering_window_seconds: 28800
  explanation_required: true
  components:
    - strategy_id: golden_cross
      strategy_version: 1.0.0
      role: CONTEXT
      sequence_index: 0
      direction_relationship: SAME
      required_states: [MATCHED, ACTIVE, WEAKENING]
    - strategy_id: swing_proximity
      strategy_version: 1.0.0
      role: LOCATION
      sequence_index: 1
      direction_relationship: SAME
      required_states: [MATCHED, ACTIVE, WEAKENING]
    - strategy_id: rejection_wick
      strategy_version: 1.0.0
      role: CONFIRMATION
      sequence_index: 2
      direction_relationship: SAME
      required_states: [MATCHED, ACTIVE]
    - strategy_id: range_breakout
      strategy_version: 1.0.0
      role: TRIGGER
      sequence_index: 3
      direction_relationship: SAME
      required_states: [MATCHED, ACTIVE]
