# BROKEN: an ordered SEQUENCE with no ordering window - "in order, within
# what period?" has no safe default, so HELIOS refuses to pick one.
schema_version: helios.strategy_package/1.0.0
kind: CHAIN
identity:
  strategy_id: broken_sequence
  strategy_version: 1.0.0
metadata:
  title: Broken sequence
  description: Missing ordering_window_seconds.
  authored_by: HSA
  authored_at_utc: 2026-01-02T11:00:00Z
inputs: []
parameters: {}
direction:
  mode: DIRECTIONAL
  resolution: FROM_COMPONENTS
  component_relationship: SAME
timing:
  evaluate_on: CLOSED_FRAME
persistence:
  min_matched_frames: 1
  weakening_enabled: false
expiry:
  mode: NEVER
chain:
  primitive: SEQUENCE
  explanation_required: true
  components:
    - strategy_id: golden_cross
      strategy_version: 1.0.0
      sequence_index: 0
      direction_relationship: SAME
      required_states: [MATCHED]
    - strategy_id: range_breakout
      strategy_version: 1.0.0
      sequence_index: 1
      direction_relationship: SAME
      required_states: [MATCHED]
