# An HSA package that is under-specified, not malformed.
#
# It says the four stages must occur IN ORDER but never says within what
# period. "In order, within what?" has no safe default, and HELIOS must refuse
# rather than pick one - picking one would be HELIOS inventing strategy logic
# that HSA never approved.
schema_version: helios.strategy_package/1.0.0
kind: CHAIN
identity:
  strategy_id: gold_staged_sequence
  strategy_version: 1.0.0
metadata:
  title: GOLD staged sequence (under-specified)
  description: >-
    Four ordered stages, with no declared ordering window.
  authored_by: HSA
  authored_at_utc: 2026-01-02T10:35:00Z
inputs:
  - role: CONTEXT
    timeframe: H4
    lookback: 2
    required_fields: [close, ema_50, ema_200]
  - role: TRIGGER
    timeframe: M5
    lookback: 20
    required_fields: [high, low, close, atr_14]
parameters: {}
direction:
  mode: DIRECTIONAL
  resolution: FROM_COMPONENTS
  component_relationship: SAME
timing:
  evaluate_on: CLOSED_FRAME
persistence:
  min_matched_frames: 1
  weakening_enabled: true
expiry:
  mode: DURATION
  duration_seconds: 28800
chain:
  primitive: SEQUENCE
  explanation_required: true
  components:
    - strategy_id: golden_cross
      strategy_version: 1.0.0
      role: CONTEXT
      sequence_index: 0
      direction_relationship: SAME
      required_states: [MATCHED, ACTIVE, WEAKENING]
    - strategy_id: range_breakout
      strategy_version: 1.0.0
      role: TRIGGER
      sequence_index: 1
      direction_relationship: SAME
      required_states: [MATCHED]
