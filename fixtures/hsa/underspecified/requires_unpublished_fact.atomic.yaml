# An HSA package that asks for a market fact HERMES does not publish.
#
# HELIOS will not compute ema_100 to fill the gap: HERMES owns indicators, and
# quietly deriving one here would make HELIOS the second, disagreeing source
# of truth for the same number.
schema_version: helios.strategy_package/1.0.0
kind: ATOMIC
identity:
  strategy_id: mid_trend_cross
  strategy_version: 1.0.0
metadata:
  title: Mid trend cross
  description: >-
    Crossing of a moving average HELIOS is not supplied with.
  authored_by: HSA
  authored_at_utc: 2026-01-02T09:20:00Z
inputs:
  - role: CONTEXT
    timeframe: H4
    lookback: 2
    required_fields: [close, ema_50, ema_100]
parameters: {}
direction:
  mode: DIRECTIONAL
  resolution: STRATEGY_LOCAL
timing:
  evaluate_on: CLOSED_FRAME
persistence:
  min_matched_frames: 1
  weakening_enabled: false
expiry:
  mode: NEVER
